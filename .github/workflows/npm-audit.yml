name: Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: 15 5 1 * *

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'npm'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Run audit
        run: npm audit
